<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>
    <link rel="stylesheet" href="flipCard.css">
</head>

<body style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 50px">
    <button id="themeToggle" class="theme-toggle">🌙</button>

    <div class="flip-card" id="flipCard1">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="images/p_gryf.png" alt="Front Image">
            </div>
            <div class="flip-card-back">
                <img src="images/gryf.png" alt="Back Image">
            </div>
        </div>
    </div>

    <div class="flip-card" id="flipCard2">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="images/p_rave.png" alt="Front Image">
            </div>
            <div class="flip-card-back">
                <img src="images/rave.png" alt="Back Image">
            </div>
        </div>
    </div>

    <div class="flip-card" id="flipCard3">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img src="images/p_sly.png" alt="Front Image">
            </div>
            <div class="flip-card-back">
                <img src="images/sly.png" alt="Back Image">
            </div>
        </div>
    </div>

    <audio id="flipSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg">
    </audio>

    <script src="flipCard.js"></script>
</body>

</html>
